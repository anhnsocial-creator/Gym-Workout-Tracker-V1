                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-500">🔍</span>
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search exercises (e.g., Bench Press, Squat)..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg text-sm focus:outline-none focus:border-sky-500 transition"
                    oninput="filterExercises()"
                >
            </div>

            <!-- Equipment Type Filters -->
            <div class="flex flex-wrap gap-2 w-full md:w-auto justify-start md:justify-end" id="equipmentFilters">
                <button onclick="setEquipmentFilter('all')" class="eq-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-sky-500 text-slate-950 transition">All Equipment</button>
                <button onclick="setEquipmentFilter('freeweights')" class="eq-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Free Weights</button>
                <button onclick="setEquipmentFilter('machine')" class="eq-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Machine</button>

                <button onclick="setEquipmentFilter('cable')" class="eq-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Cable / Other</button>
            </div>
        </div>

        <!-- Muscle Group Category Filter Tabs -->
        <div class="flex overflow-x-auto pb-4 mb-8 gap-2 border-b border-slate-800 no-scrollbar">
            <button onclick="setMuscleFilter('all')" class="muscle-tab px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap bg-sky-500 text-slate-950 transition">All Muscles</button>
            <button onclick="setMuscleFilter('Chest')" class="muscle-tab px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap bg-slate-900 text-slate-300 hover:bg-slate-800 transition">Chest</button>

        let currentMuscle = 'all';

        function renderExercises(data) {
            const grid = document.getElementById('exerciseGrid');
            const noResults = document.getElementById('noResults');
            grid.innerHTML = '';

            if (data.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            data.forEach(ex => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between hover:border-sky-500/50 transition shadow-lg group";
                card.innerHTML = `
                    <div>
                        <div class="h-28 bg-slate-950 rounded-lg mb-3 flex items-center justify-center border border-slate-800/80 group-hover:border-sky-500/30 transition">
                            <span class="text-3xl">🏋️‍♂️</span>
                        </div>
                        <h3 class="font-bold text-sm text-white mb-1">${ex.name}</h3>
                        <p class="text-xs text-sky-400 font-medium">${ex.muscle}</p>
                    </div>
                    <div class="mt-4 pt-2 border-t border-slate-800 flex justify-between items-center text-[10px] text-slate-400 uppercase tracking-wider font-semibold">
                        <span>${ex.equipment}</span>
                        <span class="text-slate-500 group-hover:text-sky-400 transition">View Guide &rarr;</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterExercises() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = exercises.filter(ex => {
                const matchesSearch = ex.name.toLowerCase().includes(query);
                const matchesMuscle = currentMuscle === 'all' || ex.muscle === currentMuscle;
                
                let matchesEquipment = true;
                if (currentEquipment !== 'all') {
                    if (currentEquipment === 'cable') {
                        matchesEquipment = (ex.equipment === 'cable' || ex.equipment === 'cardio');
                    } else {
                        matchesEquipment = ex.equipment === currentEquipment;
                    }
                }
                
                return matchesSearch && matchesMuscle && matchesEquipment;
            });

            renderExercises(filtered);
        }

        function setMuscleFilter(muscle) {
            currentMuscle = muscle;
            document.querySelectorAll('.muscle-tab').forEach(btn => {
                if (btn.textContent.trim() === muscle || (muscle === 'all' && btn.textContent.trim() === 'All Muscles')) {
                    btn.className = "muscle-tab px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap bg-sky-500 text-slate-950 transition";
                } else {
                    btn.className = "muscle-tab px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap bg-slate-900 text-slate-300 hover:bg-slate-800 transition";
                }
            });
            filterExercises();
        }

        function setEquipmentFilter(eq) {
            currentEquipment = eq;
            document.querySelectorAll('.eq-btn').forEach(btn => {
                if (btn.getAttribute('onclick').includes(eq)) {
                    btn.className = "eq-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-sky-500 text-slate-950 transition";
                } else {
                    btn.className = "eq-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
                }
            });
            filterExercises();
        }

        // Initial Load
        renderExercises(exercises);
    </script>
</body>
</html>
